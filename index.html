<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MEDINNOVA</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Antenatal Calc">
<meta name="application-name" content="Antenatal Calc">
<meta name="theme-color" content="#0f766e">
<link rel="apple-touch-icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#0F766E;--teal-b:#14B8A6;--green:#065F46;--mint:#CCFBF1;
  --t1:#0F1923;--t2:#1E2D3D;--t3:#4A5568;--t4:#718096;
  --border:#24292f;--bg:#F8FAFC;--card:#FFFFFF;--result:#F0FDF9;
  --shadow:0 1px 2px rgba(15,25,35,.04),0 4px 12px rgba(15,25,35,.05);
  --shadow-h:0 2px 4px rgba(15,25,35,.05),0 12px 28px rgba(15,118,110,.12);
  --serif:'DM Serif Display',Georgia,'Times New Roman',serif;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --teal:#14B8A6;--teal-b:#2DD4BF;--mint:#0A2232;
    --t1:#E2E8F0;--t2:#CBD5E1;--t3:#CBD5E1;--t4:#64748B;
    --border:#1E3A4A;--bg:#020C14;--card:#0C1E2E;--result:#0A2232;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 12px rgba(154, 145, 145, 0.25);
    --shadow-h:0 2px 4px rgba(0,0,0,.3),0 12px 28px rgba(20,184,166,.15);
  }
}
:root[data-theme="dark"]{
  --teal:#14B8A6;--teal-b:#2DD4BF;--mint:#0A2232;
  --t1:#E2E8F0;--t2:#CBD5E1;--t3:#CBD5E1;--t4:#64748B;
  --border:#1E3A4A;--bg:#020C14;--card:#0C1E2E;--result:#0A2232;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.25);
  --shadow-h:0 2px 4px rgba(0,0,0,.3),0 12px 28px rgba(20,184,166,.15);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--t1);font-family:var(--sans);font-size:16px;line-height:1.6;display:flex;flex-direction:column;transition:background .3s,color .3s}
.theme{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;width:40px;height:40px;border-radius:9px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;cursor:pointer;font-size:16px;transition:background .2s}
.theme:hover{background:rgba(255,255,255,.2)}
.theme:focus-visible,.card:focus-visible,footer a:focus-visible{outline:3px solid var(--teal-b);outline-offset:3px}
.hero{position:relative;background:linear-gradient(135deg,#0F766E,#065F46);color:#fff;text-align:center;padding:clamp(72px,14vw,128px) 20px clamp(64px,10vw,96px)}
.hero h1{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(2.5rem,9vw,5rem);letter-spacing:.04em;line-height:1.05}
.hero p{margin:16px auto 0;max-width:34ch;color:#CCFBF1;font-size:clamp(.95rem,2.4vw,1.125rem)}
main{flex:1;width:100%;max-width:1040px;margin:0 auto;padding:clamp(32px,6vw,56px) 20px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr);gap:20px}}
.card{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:112px;padding:24px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);color:inherit;text-decoration:none;transition:transform .25s,box-shadow .25s,border-color .25s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-h);border-color:var(--teal)}
.card h2{margin:0;font-family:var(--serif);font-weight:400;font-size:1.375rem;line-height:1.2;color:var(--t1)}
.card p{margin:6px 0 0;font-size:.9rem;color:var(--t3)}
.arrow{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--result);color:var(--teal);border:1px solid var(--border);transition:background .25s,color .25s,transform .25s}
.card:hover .arrow{background:var(--teal);color:#fff;transform:translateX(3px)}
.arrow svg{width:18px;height:18px}
footer{padding:28px 20px calc(28px + env(safe-area-inset-bottom,0px));text-align:center;border-top:1px solid var(--border);font-size:.875rem;color:var(--t4)}
footer a{color:var(--t3)!important;transition:color .2s}
footer a:hover{color:var(--teal)!important}
footer strong{color:var(--teal);font-weight:600}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="hero">
  <button class="theme" id="theme" aria-label="Toggle light and dark theme">◐</button>
  <h1>JMeD</h1>
  <p>Med Innova Nepal</p>
</header>

<main>
  <div class="grid">
    <a class="card" href="APP/anc.html">
      <div><h2>Antenatal calculator</h2><p> LMP, Fetal Growth Charts with Graphs and OGTT Analysis</p></div>
      <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>
    <a class="card" href="APP/bmi.html">
      <div><h2>BMI</h2><p>Structured summaries organised by subject.</p></div>
      <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>
    <a class="card" href="APP/morse.html">
      <div><h2>MORSE</h2><p>a simple morse code converter</p></div>
      <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>
    <a class="card" href="APP/aes.html">
      <div><h2>AES</h2><p> AES 256 bit based Encryption and Decryption system</p></div>
      <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>
  </div>
</main>

<footer>
  <a href="https://www.jimisyangbo.com.np/" target="_blank" rel="noopener" style="text-decoration: none;"><strong>by @Jimi Syangbo</strong> · MBBS 4th Year, MMC</a>
</footer>

<script>
(function(){
  var r=document.documentElement,b=document.getElementById('theme');
  function dark(){var t=r.getAttribute('data-theme');return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
  b.addEventListener('click',function(){r.setAttribute('data-theme',dark()?'light':'dark')});
})();
</script>



</body>
</html>
