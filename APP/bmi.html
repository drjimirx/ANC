<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BMI Calculator</title>
<meta name="description" content="BMI calculator">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="back.css">
<style>
:root{
  --teal:#0F766E;--teal-b:#14B8A6;--mint:#CCFBF1;
  --t1:#0F1923;--t2:#1E2D3D;--t3:#4A5568;--t4:#718096;
  --border:#E2E8F0;--bg:#F8FAFC;--card:#FFFFFF;--result:#F0FDF9;--track:#EEF2F6;
  --gold:#D97706;--err:#EF4444;--ring:rgba(20,184,166,.28);
  --pill-gold-ink:#fff;
  --shadow:0 1px 2px rgba(15,25,35,.04),0 2px 6px rgba(15,25,35,.04),0 12px 32px rgba(15,25,35,.06);
  --serif:'DM Serif Display',Georgia,'Times New Roman',serif;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --teal:#14B8A6;--teal-b:#2DD4BF;--t1:#E2E8F0;--t2:#CBD5E1;--t3:#CBD5E1;--t4:#64748B;
    --border:#1E3A4A;--bg:#020C14;--card:#0C1E2E;--result:#0A2232;--track:#071722;
    --gold:#FBBF24;--err:#F87171;--ring:rgba(45,212,191,.3);--pill-gold-ink:#0F1923;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --teal:#14B8A6;--teal-b:#2DD4BF;--t1:#E2E8F0;--t2:#CBD5E1;--t3:#CBD5E1;--t4:#64748B;
  --border:#1E3A4A;--bg:#020C14;--card:#0C1E2E;--result:#0A2232;--track:#071722;
  --gold:#FBBF24;--err:#F87171;--ring:rgba(45,212,191,.3);--pill-gold-ink:#0F1923;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--t1);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}

/* Hero */
.hero{position:relative;background:linear-gradient(135deg,#0F766E 0%,#065F46 100%);color:#fff;text-align:center;padding:48px 20px 96px;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -10% -60% -10%;height:70%;background:radial-gradient(ellipse at center,rgba(45,212,191,.22),transparent 70%);pointer-events:none}
.kicker{position:relative;display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mint);margin-bottom:14px}
.kicker i{width:6px;height:6px;border-radius:50%;background:var(--teal-b);box-shadow:0 0 0 3px rgba(45,212,191,.25)}
.hero h1{position:relative;margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(2.25rem,8vw,3rem);line-height:1.08;letter-spacing:-.005em}
.hero h1 em{font-style:italic;color:var(--mint)}
.hero p{position:relative;margin:12px auto 0;max-width:32ch;color:#CCFBF1;font-size:.95rem;opacity:.92}
.theme{position:absolute;z-index:1;top:16px;right:16px;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;transition:background .2s}
.theme:hover{background:rgba(255,255,255,.18)}
.theme svg{width:18px;height:18px}

/* Card */
.wrap{position:relative;max-width:460px;margin:-64px auto 0;padding:0 16px 40px}
.app{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px 24px 24px;box-shadow:var(--shadow);transition:background .3s,border-color .3s}
.field{margin-bottom:24px}
.field-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.field-label{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.1em}
.field-label i{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.toggle{display:flex;background:var(--track);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.toggle button{border:0;background:transparent;font:600 12px var(--sans);padding:6px 12px;min-height:30px;border-radius:7px;color:var(--t4);cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.toggle button:hover{color:var(--t1)}
.toggle button.active{background:var(--card);color:var(--teal);box-shadow:0 1px 3px rgba(15,25,35,.14),0 0 0 1px var(--border)}

/* Inputs */
.input-wrap{position:relative}
.unit{position:absolute;right:14px;top:50%;transform:translateY(-50%);font:500 12px var(--mono);color:var(--t4);pointer-events:none}
input[type=number]{width:100%;border:1.5px solid var(--border);border-radius:9px;padding:14px 52px 14px 16px;font:600 20px var(--sans);color:var(--t1);background:var(--card);outline:none;transition:border-color .2s,box-shadow .2s;-moz-appearance:textfield}
input[type=number]:hover{border-color:var(--t4)}
input[type=number]:focus{border-color:var(--teal);box-shadow:0 0 0 4px var(--ring)}
input[type=number].invalid{border-color:var(--err);box-shadow:0 0 0 4px rgba(239,68,68,.12)}
input::placeholder{color:var(--t4);opacity:.55;font-weight:500}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Button */
button:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
#calcBtn{width:100%;border:0;background:linear-gradient(135deg,#0F766E,#065F46);color:#fff;font:600 15px var(--sans);letter-spacing:.01em;padding:15px;min-height:50px;border-radius:10px;cursor:pointer;box-shadow:0 1px 2px rgba(6,95,70,.3);transition:transform .2s,box-shadow .25s,filter .2s}
#calcBtn:hover{box-shadow:0 8px 20px rgba(15,118,110,.3);filter:brightness(1.06);transform:translateY(-1px)}
#calcBtn:active{transform:translateY(0)}

/* Result */
.result{margin-top:24px;padding:28px 20px 22px;background:var(--result);border:1px solid var(--border);border-radius:14px;text-align:center;animation:rise .35s ease}
.result[hidden]{display:none}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.label{font-size:11px;font-weight:600;color:var(--t4);text-transform:uppercase;letter-spacing:.12em}
.bmi-value{font-family:var(--serif);font-size:clamp(3.5rem,16vw,4.5rem);line-height:1.05;margin-top:6px}
.bmi-category{display:inline-block;margin-top:10px;padding:5px 16px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.04em}
.gauge{margin-top:30px;padding:0 6px}
.gauge-bar{height:8px;border-radius:4px;background:linear-gradient(to right,var(--gold) 0 25%,var(--teal) 25% 50%,var(--gold) 50% 75%,var(--err) 75% 100%);position:relative}
.gauge-marker{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--card);border:3px solid var(--t1);transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.25);transition:left .4s cubic-bezier(.4,0,.2,1)}
.gauge-ticks{position:relative;height:16px;margin-top:10px}
.gauge-ticks span{position:absolute;transform:translateX(-50%);font:500 10px var(--mono);color:var(--t4)}
.gauge-ticks span:first-child{transform:none}
.gauge-ticks span:last-child{transform:translateX(-100%)}
.healthy{margin:22px 0 0;padding-top:16px;border-top:1px solid var(--border);font-size:13px;color:var(--t3)}
.healthy b{font:600 13px var(--mono);color:var(--teal)}
.note{margin:16px 8px 0;text-align:center;font-size:12px;color:var(--t4)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="hero">
  <button class="theme" id="theme" aria-label="Toggle light and dark theme">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
  <div class="kicker"><i></i>Clinical tool</div>
  <h1>Body Mass <em>Index</em></h1>
  <p>Enter weight and height in the units you prefer.</p>
</header>

<div class="wrap">
  <main class="app">
    <div class="field">
      <div class="field-header">
        <span class="field-label"><i></i>Weight</span>
        <div class="toggle" id="weightToggle">
          <button type="button" class="active" data-unit="kg">kg</button>
          <button type="button" data-unit="lbs">lbs</button>
        </div>
      </div>
      <div class="input-wrap">
        <input type="number" id="weightInput" inputmode="decimal" placeholder="0" aria-label="Weight">
        <span class="unit" id="weightUnitLbl">kg</span>
      </div>
    </div>

    <div class="field">
      <div class="field-header">
        <span class="field-label"><i></i>Height</span>
        <div class="toggle" id="heightToggle">
          <button type="button" class="active" data-unit="m">m</button>
          <button type="button" data-unit="cm">cm</button>
          <button type="button" data-unit="ftin">ft-in</button>
        </div>
      </div>
      <div class="input-wrap" id="heightWrap">
        <input type="number" id="heightInput" inputmode="decimal" placeholder="0" aria-label="Height">
        <span class="unit" id="heightUnitLbl">m</span>
      </div>
      <div class="row2" id="ftinRow" style="display:none;">
        <div class="input-wrap"><input type="number" id="feetInput" inputmode="decimal" placeholder="0" aria-label="Feet"><span class="unit">ft</span></div>
        <div class="input-wrap"><input type="number" id="inchInput" inputmode="decimal" placeholder="0" aria-label="Inches"><span class="unit">in</span></div>
      </div>
    </div>

    <button id="calcBtn" type="button">Calculate BMI</button>

    <div class="result" id="result" hidden aria-live="polite">
      <div class="label">Your BMI</div>
      <div class="bmi-value" id="bmiValue">0</div>
      <div class="bmi-category" id="bmiCategory">-</div>
      <div class="gauge">
        <div class="gauge-bar"><div class="gauge-marker" id="gaugeMarker" style="left:0%"></div></div>
        <div class="gauge-ticks">
          <span style="left:0">15</span><span style="left:25%">18.5</span><span style="left:50%">25</span><span style="left:75%">30</span><span style="left:100%">40</span>
        </div>
      </div>
      <p class="healthy" id="healthy"></p>
    </div>
  </main>

<div class="back-wrapper">
  <div class="back-button" id="medinnova-back" role="button"
       tabindex="0" aria-label="Go back">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    <span>Back to MEDINNOVA</span>
  </div>
</div>

  <p class="note">BMI is a screening measure, not a diagnosis.</p>
</div>
<script src="back.js"></script>

<script>
  const $=id=>document.getElementById(id);
  const weightToggle=$('weightToggle'),heightToggle=$('heightToggle'),weightInput=$('weightInput'),heightInput=$('heightInput'),
  heightWrap=$('heightWrap'),ftinRow=$('ftinRow'),feetInput=$('feetInput'),inchInput=$('inchInput'),calcBtn=$('calcBtn'),
  result=$('result'),bmiValueEl=$('bmiValue'),bmiCategoryEl=$('bmiCategory'),gaugeMarker=$('gaugeMarker'),healthy=$('healthy');
  let weightUnit='kg',heightUnit='m';

  function setActive(t,u){[...t.children].forEach(b=>b.classList.toggle('active',b.dataset.unit===u))}
  weightToggle.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;weightUnit=b.dataset.unit;setActive(weightToggle,weightUnit);$('weightUnitLbl').textContent=weightUnit});
  heightToggle.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    heightUnit=b.dataset.unit;setActive(heightToggle,heightUnit);
    heightWrap.style.display=heightUnit==='ftin'?'none':'block';
    ftinRow.style.display=heightUnit==='ftin'?'grid':'none';
    $('heightUnitLbl').textContent=heightUnit;
  });
  [weightInput,heightInput,feetInput,inchInput].forEach(i=>{
    i.addEventListener('input',()=>i.classList.remove('invalid'));
    i.addEventListener('keydown',e=>{if(e.key==='Enter')calcBtn.click()});
  });

  function getWeightKg(){const v=parseFloat(weightInput.value);if(isNaN(v)||v<=0)return null;return weightUnit==='kg'?v:v*0.45359237}
  function getHeightM(){
    if(heightUnit==='m'){const v=parseFloat(heightInput.value);return(isNaN(v)||v<=0)?null:v}
    if(heightUnit==='cm'){const v=parseFloat(heightInput.value);return(isNaN(v)||v<=0)?null:v/100}
    const ft=parseFloat(feetInput.value)||0,inch=parseFloat(inchInput.value)||0;
    if(ft<=0&&inch<=0)return null;
    return(ft*12+inch)*0.0254;
  }
  function categoryOf(bmi){
    if(bmi<18.5)return{label:'Underweight',color:'var(--gold)',ink:'var(--pill-gold-ink)',pct:(bmi/18.5)*25};
    if(bmi<25)return{label:'Normal',color:'var(--teal)',ink:'#fff',pct:25+((bmi-18.5)/6.5)*25};
    if(bmi<30)return{label:'Overweight',color:'var(--gold)',ink:'var(--pill-gold-ink)',pct:50+((bmi-25)/5)*25};
    return{label:'Obese',color:'var(--err)',ink:'#fff',pct:75+Math.min(((bmi-30)/10)*25,25)};
  }
  calcBtn.addEventListener('click',()=>{
    const wKg=getWeightKg(),hM=getHeightM();
    weightInput.classList.toggle('invalid',wKg===null);
    if(heightUnit==='ftin'){feetInput.classList.toggle('invalid',hM===null);inchInput.classList.toggle('invalid',hM===null)}
    else heightInput.classList.toggle('invalid',hM===null);
    if(wKg===null||hM===null)return;
    const bmi=wKg/(hM*hM),cat=categoryOf(bmi);
    bmiValueEl.textContent=bmi.toFixed(1);
    bmiValueEl.style.color=cat.color;
    bmiCategoryEl.textContent=cat.label;
    bmiCategoryEl.style.background=cat.color;
    bmiCategoryEl.style.color=cat.ink;
    gaugeMarker.style.left=Math.min(Math.max(cat.pct,0),100)+'%';
    const f=weightUnit==='kg'?1:1/0.45359237;
    healthy.innerHTML='Healthy range at your height: <b>'+(18.5*hM*hM*f).toFixed(1)+'–'+(24.9*hM*hM*f).toFixed(1)+' '+weightUnit+'</b>';
    result.hidden=false;
  });

  (function(){
    const r=document.documentElement,b=$('theme');
    const dark=()=>{const t=r.getAttribute('data-theme');return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches};
    b.addEventListener('click',()=>r.setAttribute('data-theme',dark()?'light':'dark'));
  })();


</script>
</body>
</html>
